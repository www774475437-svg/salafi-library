name: salafi_library
description: "مكتبة العلماء السلفية — كتب العلماء للقراءة والبحث والتظليل والاقتباس"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  http: ^1.2.0
  path_provider: ^2.1.4
  scrollable_positioned_list: ^0.3.8
  pdfrx: ^1.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/launcher/main_icon.png
  adaptive_icon_background: "#1F5C4A"
  adaptive_icon_foreground: tool/launcher/main_fg.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
